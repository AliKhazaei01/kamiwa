server {
    listen 127.0.0.1:8080 default_server;
    server_name localhost 127.0.0.1;
    server_tokens off;
    client_max_body_size 20m;
    # No query strings, contact details, or test credentials in access logs.
    access_log off;
    error_log /var/log/nginx/kamiwa-error.log warn;

    location /static/ {
        alias /srv/kamiwa/staticfiles/;
        gzip_static on;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        # Manifest-hashed names change whenever content changes, so they can be cached for good.
        location ~ "\.[0-9a-f]{12}\.[A-Za-z0-9]+$" {
            gzip_static on;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
    location /media/ {
        alias /srv/kamiwa/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    location ~ ^/(private_media|artifacts|deploy|\.env|\.git)(/|$) { return 404; }
    # Listing forms carry up to 5 photos (8 MB) and 2 Pro videos (60 MB); everything else keeps 20 MB.
    location ~ ^/listings/(new|[0-9]+/edit)/$ {
        client_max_body_size 170m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 50s;
    }
}
