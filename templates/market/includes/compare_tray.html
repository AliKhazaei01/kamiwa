{% if compare_listings %}<aside class="compare-tray" aria-label="آگهی‌های انتخاب‌شده برای مقایسه"><strong>{{ compare_listings|length }} آگهی برای مقایسه</strong>{% for item in compare_listings %}<div class="compare-item"><img src="{{ item.image_url }}" alt="" width="48" height="36"><span>{{ item.title|truncatechars:26 }}</span><form method="post" action="{% url 'market:compare_toggle' item.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="text-button" aria-label="حذف {{ item.title }} از مقایسه">{% include 'market/includes/icon.html' with name='close' %}</button></form></div>{% endfor %}<a class="button button-primary" href="{% url 'market:compare' %}">{% include 'market/includes/icon.html' with name='compare' %} مقایسه آگهی‌ها</a></aside>{% endif %}
